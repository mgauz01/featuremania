[project]
name = "featuremania-api"
version = "0.1.0"
description = "FastAPI backend for the Otari Games multi-repo Kanban board"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
